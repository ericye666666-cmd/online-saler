services:
  postgres:
    image: postgres:16-alpine
    container_name: online-saler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: online_saler
      POSTGRES_PASSWORD: online_saler_dev
      POSTGRES_DB: online_saler_dev
    ports:
      - "5432:5432"
    volumes:
      - online_saler_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_saler -d online_saler_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  online_saler_pgdata:
