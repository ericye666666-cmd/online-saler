name: Feature request
description: Propose a scoped feature.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operation problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
    validations:
      required: true
  - type: checkboxes
    id: mvp
    attributes:
      label: MVP boundary
      options:
        - label: This belongs to the 1,000-item Kikuyu MVP.
        - label: This can wait until after the MVP.
