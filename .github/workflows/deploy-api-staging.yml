name: Deploy API to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "apps/api/**"
      - "packages/business-rules/**"
      - "packages/shared-types/**"
      - "packages/database/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "Dockerfile.api"
      - ".dockerignore"
      - ".github/workflows/deploy-api-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: api
  MIGRATION_JOB_NAME: online-saler-db-migrate-staging
  STAGING_RUNTIME_SERVICE_ACCOUNT: online-saler-api-staging@online-saler-staging.iam.gserviceaccount.com
  STAGING_CLOUD_SQL_INSTANCE: online-saler-staging:africa-south1:online-saler-staging-db
  PRODUCT_IMAGE_BUCKET: online-saler-staging-product-images
  OPENAI_VISION_MODEL: gpt-5.6-sol

jobs:
  deploy:
    name: Bootstrap schema, storage, build and deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify OpenAI API key secret
        env:
          OPENAI_API_KEY_STAGING: ${{ secrets.OPENAI_API_KEY_STAGING }}
        run: |
          if [ -z "${OPENAI_API_KEY_STAGING}" ]; then
            echo "OPENAI_API_KEY_STAGING repository secret is not configured."
            exit 1
          fi

      - name: Configure product image bucket
        run: |
          if ! gcloud storage buckets describe "gs://${PRODUCT_IMAGE_BUCKET}" --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${PRODUCT_IMAGE_BUCKET}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --location "${{ vars.GCP_REGION }}" \
              --uniform-bucket-level-access
          fi

          gcloud storage buckets update "gs://${PRODUCT_IMAGE_BUCKET}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --uniform-bucket-level-access

          gcloud storage buckets add-iam-policy-binding "gs://${PRODUCT_IMAGE_BUCKET}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --member "serviceAccount:${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --role "roles/storage.objectAdmin"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            --file Dockerfile.api \
            --tag "${IMAGE_URI}" \
            .

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Configure staging schema job
        run: |
          gcloud run jobs deploy "${MIGRATION_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE_URI}" \
            --service-account "${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${STAGING_CLOUD_SQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=STAGING_DATABASE_URL:latest" \
            --command npm \
            --args run,db:bootstrap-staging \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet

      - name: Synchronize staging schema and seed test operator
        run: |
          gcloud run jobs execute "${MIGRATION_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=4000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --service-account=${{ env.STAGING_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ env.STAGING_CLOUD_SQL_INSTANCE }}
          env_vars: |
            NODE_ENV=staging
            PRODUCT_IMAGE_BUCKET=${{ env.PRODUCT_IMAGE_BUCKET }}
            AI_PROVIDER_MODE=openai
            OPENAI_VISION_MODEL=${{ env.OPENAI_VISION_MODEL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY_STAGING }}
          secrets: |
            DATABASE_URL=STAGING_DATABASE_URL:latest

      - name: Verify health endpoint
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          echo "Service URL: ${SERVICE_URL}"
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            "${SERVICE_URL}/health"

      - name: Verify product creation
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="DEPLOY-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          RESPONSE="$(curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\",\"employeeId\":\"00000000-0000-4000-8000-000000000001\"}" \
            "${SERVICE_URL}/products")"

          echo "${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"status":"DRAFT"'
          echo "${RESPONSE}" | grep -q '"createdByEmployeeId":"00000000-0000-4000-8000-000000000001"'

      - name: Verify real image upload and retrieval
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="UPLOAD-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRODUCT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\",\"employeeId\":\"00000000-0000-4000-8000-000000000001\"}" \
            "${SERVICE_URL}/products")"
          PRODUCT_ID="$(printf '%s' "${PRODUCT_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2ZQAAAABJRU5ErkJggg==' | base64 --decode > /tmp/product-test.png

          IMAGE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: image/png" \
            --header "X-Image-Type: FRONT" \
            --header "X-Employee-Id: 00000000-0000-4000-8000-000000000001" \
            --data-binary @/tmp/product-test.png \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/upload")"

          echo "${IMAGE_RESPONSE}"
          IMAGE_ID="$(printf '%s' "${IMAGE_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"
          echo "${IMAGE_RESPONSE}" | grep -q "gs://${PRODUCT_IMAGE_BUCKET}/staging/products/${PRODUCT_ID}/"

          curl --fail --silent --show-error \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/${IMAGE_ID}/content" \
            --output /tmp/product-test-downloaded.png
          cmp /tmp/product-test.png /tmp/product-test-downloaded.png

      - name: Verify Operations workspace API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          SUMMARY="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/operations/workspace/summary?employeeId=00000000-0000-4000-8000-000000000001")"
          echo "${SUMMARY}"
          echo "${SUMMARY}" | grep -q '"completedToday"'

          START="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"employeeId":"00000000-0000-4000-8000-000000000001"}' \
            "${SERVICE_URL}/operations/workspace/start")"
          echo "${START}"
          echo "${START}" | grep -q '"product"'
          echo "${START}" | grep -q '"employeeId":"00000000-0000-4000-8000-000000000001"'

      - name: Verify product control API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          CONTROL_SUMMARY="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/operations/product-control/summary")"
          echo "${CONTROL_SUMMARY}"
          echo "${CONTROL_SUMMARY}" | grep -q '"readyForPrice"'
          echo "${CONTROL_SUMMARY}" | grep -q '"readyToPublish"'
          echo "${CONTROL_SUMMARY}" | grep -q '"available"'
          echo "${CONTROL_SUMMARY}" | grep -q '"published"'

          CONTROL_PRODUCTS="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/operations/product-control/products")"
          echo "${CONTROL_PRODUCTS}" | grep -q '^\['

      - name: Verify public storefront products API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          PUBLIC_PRODUCTS="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/public/products")"
          echo "${PUBLIC_PRODUCTS}" | grep -q '^\['

          PUBLIC_FILTERS="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/public/products/filters")"
          echo "${PUBLIC_FILTERS}" | grep -q '"categories"'
          echo "${PUBLIC_FILTERS}" | grep -q '"total"'

      - name: Verify OpenAI image recognition
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="OPENAI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRODUCT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\",\"employeeId\":\"00000000-0000-4000-8000-000000000001\"}" \
            "${SERVICE_URL}/products")"
          PRODUCT_ID="$(printf '%s' "${PRODUCT_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          python3 - <<'PY'
          import struct
          import zlib

          width = 128
          height = 128
          raw = b"".join(b"\x00" + bytes([238, 96, 80]) * width for _ in range(height))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          with open("/tmp/openai-test.png", "wb") as file:
              file.write(png)
          PY

          IMAGE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: image/png" \
            --header "X-Image-Type: FRONT" \
            --header "X-Employee-Id: 00000000-0000-4000-8000-000000000001" \
            --data-binary @/tmp/openai-test.png \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/upload")"
          IMAGE_ID="$(printf '%s' "${IMAGE_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          AI_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productId\":\"${PRODUCT_ID}\",\"imageIds\":[\"${IMAGE_ID}\"],\"promptVersion\":\"product-v1\"}" \
            "${SERVICE_URL}/ai-jobs")"

          echo "${AI_RESPONSE}"
          echo "${AI_RESPONSE}" | grep -q '"status":"SUCCEEDED"'
          echo "${AI_RESPONSE}" | grep -q '"provider":"openai"'
