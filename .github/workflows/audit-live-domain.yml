name: Audit live Storefront domain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-live-domain.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: online-saler-staging
  GCP_REGION: africa-south1
  STOREFRONT_SERVICE: online-saler-storefront-production

jobs:
  audit:
    name: Read-only Cloud Run and load balancer audit
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Audit Cloud Run revision and safe runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services describe "${STOREFRONT_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json \
            | jq '{
                service: .metadata.name,
                url: .status.url,
                latestReadyRevision: .status.latestReadyRevisionName,
                traffic: .status.traffic,
                containers: [
                  .spec.template.spec.containers[] | {
                    image,
                    env: [
                      (.env // [])[]
                      | select(.name == "STOREFRONT_PUBLIC_URL"
                        or .name == "MPESA_ENV"
                        or .name == "MPESA_ENVIRONMENT"
                        or .name == "MPESA_ENABLE_SANDBOX_SIMULATOR"
                        or .name == "MPESA_CALLBACK_URL"
                        or .name == "MPESA_CALLBACK_BASE_URL"
                        or .name == "MPESA_PRODUCTION_LAUNCH_MODE"
                        or .name == "MPESA_TRANSACTION_TYPE"
                        or .name == "MPESA_CONSUMER_KEY"
                        or .name == "MPESA_CONSUMER_SECRET"
                        or .name == "MPESA_SHORTCODE"
                        or .name == "MPESA_PASSKEY")
                      | if (.name == "MPESA_CONSUMER_KEY"
                          or .name == "MPESA_CONSUMER_SECRET"
                          or .name == "MPESA_PASSKEY") then
                          if .valueFrom then
                            {name, configured: true, source: "secret", secretRef: .valueFrom.secretKeyRef.name}
                          else
                            {name, configured: ((.value // "") | length > 0), source: "literal-redacted"}
                          end
                        elif .valueFrom then
                          {name, secretRef: .valueFrom.secretKeyRef.name}
                        else
                          {name, value}
                        end
                    ]
                  }
                ]
              }'

      - name: Correlate recent OAuth rejections to Cloud Run revision
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_JSON="${RUNNER_TEMP}/storefront-revision.json"
          LOGS_JSON="${RUNNER_TEMP}/mpesa-oauth-rejections.json"

          gcloud run services describe "${STOREFRONT_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${SERVICE_JSON}"

          LATEST_REVISION="$(jq -r '.status.latestReadyRevisionName' "${SERVICE_JSON}")"
          echo "LATEST_READY_REVISION=${LATEST_REVISION}"
          gcloud run revisions describe "${LATEST_REVISION}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(metadata.creationTimestamp,status.conditions[0].status)'

          FILTER="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${STOREFRONT_SERVICE}\" AND timestamp>=\"2026-08-09T22:00:00Z\" AND \"Wrong credentials\""
          if gcloud logging read "${FILTER}" \
            --project="${GCP_PROJECT_ID}" \
            --limit=50 \
            --order=desc \
            --format=json > "${LOGS_JSON}"; then
            jq -r '
              if length == 0 then
                "OAUTH_REJECTION_LOGS=none_found"
              else
                "OAUTH_REJECTION_LOGS=" + (length | tostring),
                (.[] | [
                  "OAUTH_REJECTION",
                  (.timestamp // "unknown-time"),
                  (.resource.labels.revision_name // "unknown-revision"),
                  (.severity // "unknown-severity")
                ] | join(" "))
              end
            ' "${LOGS_JSON}"
          else
            echo "OAUTH_REJECTION_LOGS=unavailable"
          fi

      - name: Diagnose production Safaricom OAuth without payment
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          SERVICE_JSON="${RUNNER_TEMP}/storefront-service.json"
          KEY_FILE="${RUNNER_TEMP}/mpesa-consumer-key"
          SECRET_FILE="${RUNNER_TEMP}/mpesa-consumer-secret"
          RESPONSE_FILE="${RUNNER_TEMP}/mpesa-oauth-response.json"

          gcloud run services describe "${STOREFRONT_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format=json > "${SERVICE_JSON}"

          secret_ref() {
            local env_name="$1"
            local field="$2"
            jq -r --arg env_name "${env_name}" --arg field "${field}" '
              .spec.template.spec.containers[0].env[]
              | select(.name == $env_name)
              | .valueFrom.secretKeyRef[$field] // empty
            ' "${SERVICE_JSON}"
          }

          KEY_SECRET="$(secret_ref MPESA_CONSUMER_KEY name)"
          KEY_VERSION="$(secret_ref MPESA_CONSUMER_KEY key)"
          CONSUMER_SECRET="$(secret_ref MPESA_CONSUMER_SECRET name)"
          CONSUMER_SECRET_VERSION="$(secret_ref MPESA_CONSUMER_SECRET key)"

          if [ -z "${KEY_SECRET}" ] || [ -z "${CONSUMER_SECRET}" ]; then
            echo "OAuth diagnostic failed: Cloud Run is missing one or both Secret Manager references." >&2
            exit 1
          fi

          KEY_VERSION="${KEY_VERSION:-latest}"
          CONSUMER_SECRET_VERSION="${CONSUMER_SECRET_VERSION:-latest}"

          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}"
          echo "CLOUD_RUN_SERVICE=${STOREFRONT_SERVICE}"
          echo "CONSUMER_KEY_REF=${KEY_SECRET}:${KEY_VERSION}"
          echo "CONSUMER_SECRET_REF=${CONSUMER_SECRET}:${CONSUMER_SECRET_VERSION}"

          gcloud secrets versions describe "${KEY_VERSION}" \
            --project="${GCP_PROJECT_ID}" \
            --secret="${KEY_SECRET}" \
            --format='value(name,createTime,state)'
          gcloud secrets versions describe "${CONSUMER_SECRET_VERSION}" \
            --project="${GCP_PROJECT_ID}" \
            --secret="${CONSUMER_SECRET}" \
            --format='value(name,createTime,state)'

          gcloud secrets versions access "${KEY_VERSION}" \
            --project="${GCP_PROJECT_ID}" \
            --secret="${KEY_SECRET}" > "${KEY_FILE}"
          gcloud secrets versions access "${CONSUMER_SECRET_VERSION}" \
            --project="${GCP_PROJECT_ID}" \
            --secret="${CONSUMER_SECRET}" > "${SECRET_FILE}"

          node - "${KEY_FILE}" "${SECRET_FILE}" <<'NODE'
          const fs = require("node:fs");
          for (const path of process.argv.slice(2)) {
            const trimmed = fs.readFileSync(path, "utf8").trim();
            if (!trimmed) {
              throw new Error("A production OAuth credential is empty after trimming.");
            }
            fs.writeFileSync(path, trimmed, { mode: 0o600 });
          }
          NODE

          CONSUMER_KEY="$(<"${KEY_FILE}")"
          CONSUMER_SECRET_VALUE="$(<"${SECRET_FILE}")"
          echo "::add-mask::${CONSUMER_KEY}"
          echo "::add-mask::${CONSUMER_SECRET_VALUE}"

          if ! HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --output "${RESPONSE_FILE}" \
            --write-out '%{http_code}' \
            --user "${CONSUMER_KEY}:${CONSUMER_SECRET_VALUE}" \
            'https://api.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials')"; then
            echo "OAUTH_RESULT=network_error"
            exit 1
          fi

          echo "OAUTH_HTTP_STATUS=${HTTP_STATUS}"
          if [[ "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]] \
            && jq -e '.access_token | type == "string" and length > 0' "${RESPONSE_FILE}" >/dev/null 2>&1; then
            echo "OAUTH_RESULT=success"
            exit 0
          fi

          ERROR_MESSAGE="$(jq -r '
            (.errorMessage // .error_description // .error // "provider response redacted")
            | tostring
          ' "${RESPONSE_FILE}" 2>/dev/null || echo "provider response was not JSON and was redacted")"
          ERROR_MESSAGE="$(printf '%s' "${ERROR_MESSAGE}" | tr '\r\n' ' ' | cut -c1-200)"
          echo "OAUTH_RESULT=rejected"
          echo "OAUTH_ERROR=${ERROR_MESSAGE}"
          exit 1

      - name: Audit domain load balancer resources
        shell: bash
        run: |
          set -euo pipefail

          audit_resource() {
            local label="$1"
            shift
            echo "::group::${label}"
            if "$@"; then
              :
            else
              echo "NOT_FOUND"
            fi
            echo "::endgroup::"
          }

          audit_resource "Static IPv4: dloop-storefront-ip" \
            gcloud compute addresses describe dloop-storefront-ip \
              --project="${GCP_PROJECT_ID}" --global \
              --format='yaml(name,address,addressType,ipVersion,status)'

          audit_resource "Serverless NEG: dloop-storefront-neg" \
            gcloud compute network-endpoint-groups describe dloop-storefront-neg \
              --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" \
              --format='yaml(name,region,networkEndpointType,cloudRun)'

          audit_resource "Backend: dloop-storefront-backend" \
            gcloud compute backend-services describe dloop-storefront-backend \
              --project="${GCP_PROJECT_ID}" --global \
              --format='yaml(name,protocol,loadBalancingScheme,backends)'

          audit_resource "Certificate: dloop-co-ke-cert" \
            gcloud compute ssl-certificates describe dloop-co-ke-cert \
              --project="${GCP_PROJECT_ID}" --global \
              --format='yaml(name,type,managed.domains,managed.status,managed.domainStatus)'

          audit_resource "HTTPS forwarding rule: dloop-https" \
            gcloud compute forwarding-rules describe dloop-https \
              --project="${GCP_PROJECT_ID}" --global \
              --format='yaml(name,IPAddress,IPProtocol,portRange,loadBalancingScheme,target)'

          audit_resource "URL map: dloop-storefront-lb" \
            gcloud compute url-maps describe dloop-storefront-lb \
              --project="${GCP_PROJECT_ID}" --global \
              --format='yaml(name,defaultService)'
