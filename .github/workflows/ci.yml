name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/lightweight-cutout/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install lightweight cutout dependencies
        run: python -m pip install -r services/lightweight-cutout/requirements.txt

      - name: Test lightweight cutout engine
        env:
          PYTHONPATH: services/lightweight-cutout
        run: python -m unittest discover -s services/lightweight-cutout/tests -p 'test_*.py'

      - name: Run repository checks
        run: npm run ci
