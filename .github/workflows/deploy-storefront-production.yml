name: Deploy Storefront to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-production to deploy the production Storefront service."
        required: true
      mpesa_launch_mode:
        description: "Use one_ksh for the first Till test. Use live only after sign-off."
        required: true
        default: "one_ksh"
        type: choice
        options:
          - one_ksh
          - live

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: storefront
  SERVICE_NAME: online-saler-storefront-production

jobs:
  deploy:
    name: Build and deploy production Storefront
    runs-on: ubuntu-latest

    steps:
      - name: Confirm production deployment
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-production" ]; then
            echo "Production deployment was not confirmed." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_PRODUCTION }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_PRODUCTION }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify production Secret Manager prerequisites
        run: |
          set -euo pipefail

          for secret in \
            PRODUCTION_DATABASE_URL \
            PRODUCTION_CUSTOMER_SESSION_SECRET \
            PRODUCTION_GOOGLE_CLIENT_SECRET \
            PRODUCTION_INTERNAL_CRON_SECRET \
            PRODUCTION_MPESA_CONSUMER_KEY \
            PRODUCTION_MPESA_CONSUMER_SECRET \
            PRODUCTION_MPESA_SHORTCODE \
            PRODUCTION_MPESA_TILL_NUMBER \
            PRODUCTION_MPESA_PASSKEY \
            PRODUCTION_MPESA_TEST_PHONE_WHITELIST
          do
            gcloud secrets versions access latest \
              --project "${{ vars.GCP_PROJECT_ID_PRODUCTION }}" \
              --secret "${secret}" >/dev/null
          done

          BUSINESS_SHORTCODE="$(gcloud secrets versions access latest \
            --project "${{ vars.GCP_PROJECT_ID_PRODUCTION }}" \
            --secret PRODUCTION_MPESA_SHORTCODE | tr -d '[:space:]')"
          TILL_NUMBER="$(gcloud secrets versions access latest \
            --project "${{ vars.GCP_PROJECT_ID_PRODUCTION }}" \
            --secret PRODUCTION_MPESA_TILL_NUMBER | tr -d '[:space:]')"

          if ! [[ "${BUSINESS_SHORTCODE}" =~ ^[0-9]+$ ]] || ! [[ "${TILL_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "Production M-Pesa H.O. shortcode and Till number must both be numeric." >&2
            exit 1
          fi

          if [ "${BUSINESS_SHORTCODE}" = "${TILL_NUMBER}" ]; then
            echo "Production M-Pesa H.O. shortcode and Till number must be different values." >&2
            exit 1
          fi

          if [ "${{ inputs.mpesa_launch_mode }}" = "one_ksh" ]; then
            TEST_WHITELIST="$(gcloud secrets versions access latest \
              --project "${{ vars.GCP_PROJECT_ID_PRODUCTION }}" \
              --secret PRODUCTION_MPESA_TEST_PHONE_WHITELIST)"

            if [ -z "${TEST_WHITELIST}" ]; then
              echo "PRODUCTION_MPESA_TEST_PHONE_WHITELIST must contain at least one test phone in one_ksh mode." >&2
              exit 1
            fi
          fi

          if [ "${{ inputs.mpesa_launch_mode }}" = "live" ]; then
            echo "Live M-Pesa amount deployment selected. This should only run after a signed-off 1 KSh test."
          fi

          if [ -z "${{ vars.MPESA_CALLBACK_URL_PRODUCTION }}" ]; then
            echo "MPESA_CALLBACK_URL_PRODUCTION is required." >&2
            exit 1
          fi

          case "${{ vars.MPESA_CALLBACK_URL_PRODUCTION }}" in
            https://*/api/payments/mpesa/callback) ;;
            *)
              echo "MPESA_CALLBACK_URL_PRODUCTION must be an HTTPS /api/payments/mpesa/callback URL." >&2
              exit 1
              ;;
          esac

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION_PRODUCTION }}-docker.pkg.dev" \
            --quiet

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION_PRODUCTION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID_PRODUCTION }}/${{ vars.GCP_ARTIFACT_REPOSITORY_PRODUCTION }}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Workspace: ${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}"
          test -s "${GITHUB_WORKSPACE}/Dockerfile.storefront"

          docker build \
            --file "${GITHUB_WORKSPACE}/Dockerfile.storefront" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_PRODUCTION }}" \
            --tag "${IMAGE_URI}" \
            "${GITHUB_WORKSPACE}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION_PRODUCTION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=3000
            --memory=1Gi
            --cpu=1
            --min-instances=1
            --max-instances=5
            --service-account=${{ vars.GCP_STOREFRONT_SERVICE_ACCOUNT_PRODUCTION }}
            --add-cloudsql-instances=${{ vars.GCP_CLOUD_SQL_INSTANCE_PRODUCTION }}
          env_vars: |
            NODE_ENV=production
            API_URL=${{ vars.API_URL_PRODUCTION }}
            STOREFRONT_PUBLIC_URL=${{ vars.STOREFRONT_PUBLIC_URL_PRODUCTION }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_PRODUCTION }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID_PRODUCTION }}
            MPESA_ENV=production
            MPESA_ENVIRONMENT=production
            MPESA_TRANSACTION_TYPE=CustomerBuyGoodsOnline
            MPESA_CALLBACK_URL=${{ vars.MPESA_CALLBACK_URL_PRODUCTION }}
            MPESA_PRODUCTION_LAUNCH_MODE=${{ inputs.mpesa_launch_mode }}
            MPESA_TEST_AMOUNT_KSH=1
            MPESA_ENABLE_SANDBOX_SIMULATOR=false
            MPESA_ACCOUNT_REFERENCE_PREFIX=DLOOP
          secrets: |
            DATABASE_URL=PRODUCTION_DATABASE_URL:latest
            CUSTOMER_SESSION_SECRET=PRODUCTION_CUSTOMER_SESSION_SECRET:latest
            GOOGLE_CLIENT_SECRET=PRODUCTION_GOOGLE_CLIENT_SECRET:latest
            INTERNAL_CRON_SECRET=PRODUCTION_INTERNAL_CRON_SECRET:latest
            MPESA_CONSUMER_KEY=PRODUCTION_MPESA_CONSUMER_KEY:latest
            MPESA_CONSUMER_SECRET=PRODUCTION_MPESA_CONSUMER_SECRET:latest
            MPESA_SHORTCODE=PRODUCTION_MPESA_SHORTCODE:latest
            MPESA_TILL_NUMBER=PRODUCTION_MPESA_TILL_NUMBER:latest
            MPESA_PASSKEY=PRODUCTION_MPESA_PASSKEY:latest
            MPESA_TEST_PHONE_WHITELIST=PRODUCTION_MPESA_TEST_PHONE_WHITELIST:latest

      - name: Verify Storefront production surface
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Service URL: ${SERVICE_URL}"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}" \
            | grep -q "Direct Loop"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/checkout" \
            | grep -q "Checkout"

          CALLBACK_STATUS="$(curl \
            --show-error \
            --silent \
            --output /tmp/mpesa-callback-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "content-type: application/json" \
            --data '{}' \
            "${SERVICE_URL}/api/payments/mpesa/callback")"

          if [ "${CALLBACK_STATUS}" != "400" ]; then
            cat /tmp/mpesa-callback-response.json >&2
            echo "Expected M-Pesa callback endpoint to reject malformed payload with HTTP 400, got ${CALLBACK_STATUS}." >&2
            exit 1
          fi

      - name: Configure production reservation cleanup scheduler
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID_PRODUCTION }}
          GCP_SCHEDULER_REGION: ${{ vars.GCP_SCHEDULER_REGION_PRODUCTION }}
          STOREFRONT_PUBLIC_URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/gcloud/configure-production-scheduler.sh
