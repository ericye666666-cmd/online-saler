name: Render run-through sample
on:
  push:
    branches: [render/tshirts-sample]
jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-liberation
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: |
          mkdir -p out
          for v in grid hero strip; do
            npx remotion still src/index.ts RunThroughVideo out/cover-$v.png --props=props-$v.json --frame=0
            npx remotion still src/index.ts RunThroughVideo out/item-$v.png --props=props-$v.json --frame=36
          done
          npx remotion render src/index.ts RunThroughVideo out/sample-hero.mp4 --props=props-hero.json --codec=h264
      - uses: actions/upload-artifact@v4
        with:
          name: run-through
          path: render-sample/out
