name: Deploy Lightweight Cutout to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "services/lightweight-cutout/**"
      - "Dockerfile.image-processor-lite"
      - ".github/workflows/deploy-lightweight-cutout-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: image-processor-lite
  SERVICE_NAME: online-saler-image-lite-staging
  STAGING_RUNTIME_SERVICE_ACCOUNT: online-saler-api-staging@online-saler-staging.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy lightweight cutout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Build lightweight processor image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build \
            --file Dockerfile.image-processor-lite \
            --tag "${IMAGE_URI}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push lightweight processor image
        run: docker push "${IMAGE_URI}"

      - name: Deploy private Cloud Run processor
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE_URI}" \
            --service-account "${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --memory 2Gi \
            --concurrency 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      - name: Allow API service account to invoke processor
        run: |
          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --member "serviceAccount:${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --role "roles/run.invoker" \
            --quiet

          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --member "serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}" \
            --role "roles/run.invoker" \
            --quiet

      - name: Resolve and verify processor URL
        run: |
          SERVICE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')"
          if [ -z "${SERVICE_URL}" ]; then
            echo "Lightweight cutout service URL was empty."
            exit 1
          fi

          ID_TOKEN="$(gcloud auth print-identity-token --audiences="${SERVICE_URL}")"
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            --header "Authorization: Bearer ${ID_TOKEN}" \
            "${SERVICE_URL}/health"

          echo "LIGHTWEIGHT_CUTOUT_SERVICE_URL=${SERVICE_URL}" >> "${GITHUB_ENV}"

      - name: Point staging API at lightweight processor
        run: |
          gcloud run services update "${{ vars.GCP_SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "BACKGROUND_REMOVAL_PROVIDER=lightweight,LIGHTWEIGHT_CUTOUT_SERVICE_URL=${LIGHTWEIGHT_CUTOUT_SERVICE_URL},LIGHTWEIGHT_CUTOUT_AUTH_MODE=google_identity" \
            --quiet
