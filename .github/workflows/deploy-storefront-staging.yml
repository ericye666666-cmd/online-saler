name: Deploy Live Storefront

on:
  push:
    branches:
      - develop
    paths:
      - "apps/storefront/**"
      - "packages/business-rules/**"
      - "packages/database/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "Dockerfile.storefront"
      - ".dockerignore"
      - "scripts/gcloud/configure-staging-scheduler.sh"
      - ".github/workflows/deploy-storefront-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: storefront
  SERVICE_NAME: online-saler-storefront-staging
  STAGING_RUNTIME_SERVICE_ACCOUNT: online-saler-api-staging@online-saler-staging.iam.gserviceaccount.com
  STAGING_CLOUD_SQL_INSTANCE: online-saler-staging:africa-south1:online-saler-staging-db
  PRODUCT_IMAGE_BUCKET: online-saler-staging-product-images

jobs:
  deploy:
    name: Build and deploy live Storefront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify live M-Pesa secrets
        run: |
          set -euo pipefail

          for secret in \
            PRODUCTION_MPESA_CONSUMER_KEY \
            PRODUCTION_MPESA_CONSUMER_SECRET \
            PRODUCTION_MPESA_SHORTCODE \
            PRODUCTION_MPESA_PASSKEY
          do
            gcloud secrets versions access latest \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --secret "${secret}" >/dev/null
          done

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Resolve staging API URL
        run: |
          API_URL="$(gcloud run services describe online-saler-api-staging \
            --region "${{ vars.GCP_REGION }}" \
            --format "value(status.url)")"

          if [ -z "${API_URL}" ]; then
            echo "online-saler-api-staging has no status.url" >&2
            exit 1
          fi

          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"

      - name: Resolve staging Storefront URL
        run: |
          STOREFRONT_PUBLIC_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --region "${{ vars.GCP_REGION }}" \
            --format "value(status.url)" 2>/dev/null || true)"

          if [ -z "${STOREFRONT_PUBLIC_URL}" ]; then
            STOREFRONT_PUBLIC_URL="https://${SERVICE_NAME}-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app"
          fi

          echo "STOREFRONT_PUBLIC_URL=${STOREFRONT_PUBLIC_URL}" >> "${GITHUB_ENV}"

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            --file Dockerfile.storefront \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_STAGING }}" \
            --tag "${IMAGE_URI}" \
            .

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Remove legacy plain-text M-Pesa runtime variables
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "${SERVICE_NAME}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --remove-env-vars=MPESA_CONSUMER_KEY,MPESA_CONSUMER_SECRET,MPESA_SHORTCODE,MPESA_PASSKEY \
            --quiet

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=3000
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=2
            --service-account=${{ env.STAGING_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ env.STAGING_CLOUD_SQL_INSTANCE }}
          env_vars: |
            NODE_ENV=production
            API_URL=${{ env.API_URL }}
            STOREFRONT_PUBLIC_URL=${{ env.STOREFRONT_PUBLIC_URL }}
            PRODUCT_IMAGE_BUCKET=${{ env.PRODUCT_IMAGE_BUCKET }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY_STAGING }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID_STAGING }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_STAGING }}
            CUSTOMER_SESSION_SECRET=${{ secrets.CUSTOMER_SESSION_SECRET_STAGING }}
            INTERNAL_CRON_SECRET=${{ secrets.INTERNAL_CRON_SECRET_STAGING }}
            MPESA_ENV=production
            MPESA_ENVIRONMENT=production
            MPESA_ENABLE_SANDBOX_SIMULATOR=false
            MPESA_CALLBACK_URL=${{ env.STOREFRONT_PUBLIC_URL }}/api/payments/mpesa/callback
            MPESA_CALLBACK_BASE_URL=${{ env.STOREFRONT_PUBLIC_URL }}
            MPESA_PRODUCTION_LAUNCH_MODE=live
            MPESA_TRANSACTION_TYPE=CustomerBuyGoodsOnline
            MPESA_ACCOUNT_REFERENCE_PREFIX=DLOOP
          secrets: |
            DATABASE_URL=STAGING_DATABASE_URL:latest
            MPESA_CONSUMER_KEY=PRODUCTION_MPESA_CONSUMER_KEY:latest
            MPESA_CONSUMER_SECRET=PRODUCTION_MPESA_CONSUMER_SECRET:latest
            MPESA_SHORTCODE=PRODUCTION_MPESA_SHORTCODE:latest
            MPESA_PASSKEY=PRODUCTION_MPESA_PASSKEY:latest

      - name: Verify Storefront page
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          echo "Service URL: ${SERVICE_URL}"
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}" \
            | grep -q "Direct Loop"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/api-proxy/public/products" \
            | grep -q '^\['

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/api-proxy/public/products/filters" \
            | grep -q '"categories"'

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/cart" \
            | grep -q "Your cart"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/checkout" \
            | grep -q "Checkout"

          CALLBACK_STATUS="$(curl \
            --show-error \
            --silent \
            --output /tmp/mpesa-callback-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "content-type: application/json" \
            --data '{}' \
            "${SERVICE_URL}/api/payments/mpesa/callback")"

          if [ "${CALLBACK_STATUS}" != "400" ]; then
            cat /tmp/mpesa-callback-response.json >&2
            echo "Expected M-Pesa callback endpoint to reject malformed payload with HTTP 400, got ${CALLBACK_STATUS}." >&2
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/seller/staging-affiliate" \
            | grep -q "Staging Affiliate"

      - name: Configure live reservation cleanup scheduler
        continue-on-error: true
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          STOREFRONT_PUBLIC_URL: ${{ steps.deploy.outputs.url }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET_STAGING }}
        run: |
          if [ -z "${INTERNAL_CRON_SECRET}" ]; then
            echo "INTERNAL_CRON_SECRET_STAGING is not configured; skipping Cloud Scheduler setup."
            exit 0
          fi
          bash scripts/gcloud/configure-staging-scheduler.sh

      - name: Print Storefront diagnostics
        if: failure()
        run: |
          gcloud run services logs read "${SERVICE_NAME}" \
            --region "${{ vars.GCP_REGION }}" \
            --limit 100
