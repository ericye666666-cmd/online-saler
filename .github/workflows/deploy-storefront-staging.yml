name: Deploy Storefront to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "apps/storefront/**"
      - "packages/business-rules/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "Dockerfile.storefront"
      - ".dockerignore"
      - ".github/workflows/deploy-storefront-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: storefront
  SERVICE_NAME: online-saler-storefront-staging

jobs:
  deploy:
    name: Build and deploy Storefront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Resolve staging API URL
        run: |
          API_URL="$(gcloud run services describe online-saler-api-staging \
            --region "${{ vars.GCP_REGION }}" \
            --format "value(status.url)")"

          if [ -z "${API_URL}" ]; then
            echo "online-saler-api-staging has no status.url" >&2
            exit 1
          fi

          echo "API_URL=${API_URL}" >> "${GITHUB_ENV}"

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            --file Dockerfile.storefront \
            --tag "${IMAGE_URI}" \
            .

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
          env_vars: |
            NODE_ENV=staging
            API_URL=${{ env.API_URL }}

      - name: Verify Storefront page
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          echo "Service URL: ${SERVICE_URL}"
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}" \
            | grep -q "Fresh second-hand finds"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_URL}/api-proxy/public/products" \
            | grep -q '^\['
