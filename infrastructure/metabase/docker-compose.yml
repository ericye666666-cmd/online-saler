services:
  metabase-app-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METABASE_APP_DB_NAME:-metabase}
      POSTGRES_USER: ${METABASE_APP_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD}
    volumes:
      - metabase_app_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.63.2
    restart: unless-stopped
    depends_on:
      metabase-app-db:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabase}
      MB_DB_USER: ${METABASE_APP_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY}
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3003}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  metabase_app_db:
